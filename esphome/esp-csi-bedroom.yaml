# ESP CSI Presence Sensor - Master Bedroom (1F)
# Hardware: Seeed XIAO ESP32-C3
# Based on: https://github.com/francescopace/espectre/blob/main/examples/espectre-c3.yaml

substitutions:
  git_ref: main
  detection_algorithm: mvs  # mvs (default) or ml (experimental, no calibration needed)

esphome:
  name: esp-csi-bedroom
  friendly_name: "CSI Presence - Bedroom"
  min_version: 2025.11.0
  project:
    name: francescopace.espectre
    version: ${git_ref}

esp32:
  variant: ESP32C3
  board: seeed_xiao_esp32c3
  framework:
    type: esp-idf

# Load ESPectre component from GitHub
external_components:
  - source:
      type: git
      url: https://github.com/francescopace/espectre
      ref: ${git_ref}
    components: [ espectre ]
    refresh: always

# ESPectre - WiFi CSI Motion Detection
espectre:
  id: espectre_csi
  detection_algorithm: ${detection_algorithm}
  traffic_generator_rate: 94  # Keep ≤94 for C3 boards

wifi:
  ssid: "internetoftings"
  password: !secret wifi_password
  manual_ip:
    static_ip: 192.168.0.174
    gateway: 192.168.0.254
    subnet: 255.255.255.0
    dns1: 192.168.0.30  # AdGuard on Pi

# MQTT for Naboo agent + general use
mqtt:
  broker: 192.168.0.50
  port: 1883
  topic_prefix: esp-csi/bedroom

# Home Assistant API
api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

logger:
  level: DEBUG  # Use DEBUG initially for calibration visibility

# Status LED (XIAO C3 has built-in LED on GPIO10)
light:
  - platform: status_led
    name: "Status LED"
    pin: GPIO10
